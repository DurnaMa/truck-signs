services:
  db:
    image: postgres:18.6-alpine
    container_name: tsa_db
    env_file: .env
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tsa_backend
    
    networks:
      - tsa-network
    environment:
      MODE: prod
      DEBUG_ENABLED: 'False'
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: tsa_db
      DB_PORT: ${DB_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SUPER_USER_NAME: ${SUPER_USER_NAME}
      SUPER_USER_EMAIL: ${SUPER_USER_EMAIL}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD}
    volumes:
      - ./src/staticfiles:/app/src/staticfiles
      - ./src/media:/app/src/media
    ports:
      - '8020:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge
